<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f9fa">
<title>추천결과지 프로토타입</title>
<style>
:root{--green:#2AAD5C;--green-light:#F1FBF5;--ink:#222;--muted:#757575;--gray:#F8F9FA;--line:#DDD}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
body{background:#f5f6f7}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #2AAD5C;outline-offset:2px}
.stage{display:flex;min-height:100dvh;align-items:center;justify-content:center;gap:28px;padding:16px}
.outside{display:flex;flex-direction:column;gap:12px;width:180px;flex:0 0 180px}
.outside h1{font-size:22px;line-height:1.4;letter-spacing:-.05em;margin:0 0 16px}
.outside button{min-height:46px;background:#fff;border:1px solid #D6DDD8;border-radius:8px;text-align:left;padding:9px 13px;font-size:14px;font-weight:600}
.outside button:disabled{opacity:.38;cursor:not-allowed}
.phone{position:relative;flex:0 0 360px;width:360px;height:715px;overflow:hidden;background:#fff;border:1px solid #DDD;border-radius:32px;box-shadow:0 13px 40px #203a251d}
.header{position:absolute;left:0;right:0;top:0;height:56px;z-index:10;display:flex;align-items:center;justify-content:center;background:#fff}
.header.is-result{background:rgba(248,249,250,.9);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.header-title{font-size:16px;font-weight:700;line-height:22px;letter-spacing:-.32px}
.back{position:absolute;top:4px;left:4px;width:48px;height:48px;border:0;background:transparent;color:#222;font-size:27px;display:flex;align-items:center;justify-content:center}
.close-head{position:absolute;top:4px;right:4px;width:48px;height:48px;background:transparent;border:0;font-size:27px}
.surface{position:absolute;inset:56px 0 132px;overflow-y:auto;padding:24px 20px 30px;background:#fff}
.surface::-webkit-scrollbar,.chat-body::-webkit-scrollbar,.sheet-body::-webkit-scrollbar{display:none}
.surface,.chat-body,.sheet-body{scrollbar-width:none;overscroll-behavior:contain}
.title{margin:0;color:#222;font-size:24px;font-weight:700;line-height:1.4;letter-spacing:-.6px}
.subtitle{margin:8px 0 0;color:#757575;font-size:16px;font-weight:400;line-height:1.4;letter-spacing:-.32px}
.footer{position:absolute;bottom:0;left:0;right:0;height:132px;background:#fff;padding:36px 20px 40px;z-index:8}
.footer.chat-footer{background:rgba(255,255,255,.98)}
.cta{height:56px;width:100%;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:16px;font-weight:700;line-height:1.4;letter-spacing:-.32px}
.cta:disabled{background:#B8DCC4;cursor:not-allowed}
.options{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px;align-content:flex-start}
.opt{display:inline-flex;height:48px;padding:8px 16px;justify-content:center;align-items:center;gap:8px;flex:0 0 auto;border:1px solid transparent;border-radius:6px;background:#F8F9FA;color:#222;font-family:inherit;font-size:16px;font-weight:500;line-height:140%;letter-spacing:-.32px;white-space:nowrap}
.opt.is-active{border:1px solid #2AAD5C;background:#F1FBF5;color:#2AAD5C}
.opt svg{display:block;width:18px;height:18px;flex:0 0 18px}
.two-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:40px}
.large-pick{height:98px;border:1px solid transparent;border-radius:10px;background:#F8F9FA;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}
.large-pick.is-active{background:#F1FBF5;border-color:#2AAD5C}
.large-pick img{display:block;width:40px;height:40px;object-fit:contain}
.pack-field{position:relative;width:320px;height:56px;border:1px solid #DDD;border-radius:8px;background:#fff;margin-top:40px;display:flex;align-items:center;padding:0 44px 0 16px}
.pack-field:focus-within,.pack-field.has-text{border-color:#4CAF50}
.pack-field label{display:none;position:absolute;left:16px;top:6px;color:#AAA;font-size:13px;line-height:130%;font-weight:400;letter-spacing:-.13px}
.pack-field:focus-within label,.pack-field.has-text label{display:block}
.pack-field input{width:100%;min-width:0;border:0;background:none;color:#222;outline:0;font-size:16px;line-height:140%;font-weight:400;letter-spacing:-.32px}
.pack-field:focus-within input,.pack-field.has-text input{padding-top:15px}
.pack-field input::placeholder{color:#AAA;opacity:1}
.clear-name{position:absolute;top:17px;right:14px;border:0;background:transparent;padding:0;width:20px;height:20px;display:none}
.pack-field.has-text .clear-name{display:block}
.pack-field .clear-name svg{width:20px;height:20px}
.pack-card{position:relative;width:190px;height:215px;margin:34px auto 0;padding:20px;background:#fff;box-shadow:0 3px 11px #0000001c;border:1px solid #F0F0F0;display:flex;flex-direction:column}
.pack-card:before,.pack-card:after{content:"";position:absolute;left:-9px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:9px solid #fff}
.pack-card:before{top:36px}.pack-card:after{top:61px}
.pack-logo{display:block;width:46px;height:14px;object-fit:contain;margin-bottom:22px}
.pack-name{font-size:16px;font-weight:750;line-height:1.4;margin:0 0 4px}
.pack-line{height:4px;width:132px;background:#222;margin-bottom:14px}
.pack-ingredients{font-size:12px;line-height:1.5;color:#757575}
.pack-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;font-size:8px;color:#333}
.pack-badge{padding:5px 8px;background:#222;border-radius:3px;color:#fff;font-size:8px}
.chat-body{position:absolute;top:56px;bottom:0;left:0;right:0;overflow-y:auto;background:#F8F9FA;padding:24px 20px 24px;z-index:1}
.chat-message{margin-bottom:12px;animation:arrive .24s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bot-avatar{display:block;width:32px;height:32px;object-fit:contain;margin-bottom:12px}
.bot-bubble{width:300px;background:#fff;border-radius:0 18px 18px 18px;padding:20px 16px;box-shadow:0 1px 3px #00000007}
.bot-bubble h3{margin:0;font-size:16px;line-height:1.4;letter-spacing:-.32px;font-weight:550}
.statuses{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;margin-bottom:20px}
.status{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;border-right:1px solid #ECECEC}
.status:last-child{border-right:0}
.status .symbol{height:24px;width:24px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.status.danger{color:#F60909}.status.danger .symbol{background:#FEE6E6}
.status.warning{color:#FF7A00}.status.warning .symbol{background:#FFF0DC}
.status.good{color:#228A4A}.status.good .symbol{background:#E8F5E9}
.detail-btn{width:268px;max-width:100%;height:32px;border-radius:6px;border:1px solid #DDD;background:#fff;color:#222;font-size:13px;font-weight:500}
.condition-list{margin-top:18px;background:#F8F9FA;border-radius:10px;padding:4px 12px}
.condition-item{display:flex;align-items:flex-start;gap:8px;padding:13px 0;border-bottom:1px solid #EEE}
.condition-item:last-child{border-bottom:0}
.condition-item img{width:40px;height:40px;flex:0 0 40px;object-fit:contain}
.condition-item strong{display:block;font-size:16px;color:#228A4A;line-height:1.4;margin-bottom:4px}
.condition-item p{margin:0;color:#757575;font-size:13px;line-height:1.4}
.user-choice{display:flex;justify-content:flex-end;margin:12px 0 18px}
.user-choice button,.user-choice span{background:#2AAD5C;color:#fff;border:0;border-radius:16px 3px 16px 16px;padding:13px 16px;font-size:15px;font-weight:600}
.grouped-ingredients{margin-top:18px;background:#F8F9FA;padding:14px 12px;border-radius:10px}
.group-head{display:flex;justify-content:space-between;font-size:14px;color:#222;font-weight:700;margin-bottom:12px}
.group-head small{font-size:13px;font-weight:500;color:#757575}
.ingredient-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ingredient{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:8px 4px;background:#fff;border-radius:8px;font-size:14px;line-height:1.4}
.ingredient.caution{color:#222}
.verify-box{margin-top:20px;background:#F1FBF5;border-radius:10px;padding:15px 12px}
.verify-head{text-align:center;font-size:13px;color:#228A4A;font-weight:700;margin-bottom:12px}
.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verify-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:105px;border-radius:8px;background:#fff;text-align:center;font-size:13px;line-height:1.4}
.verify-tile strong{display:block;color:#228A4A;font-size:24px}
.sheet-overlay{position:absolute;inset:56px 0 0;background:#0006;z-index:20;display:flex;align-items:flex-end}
.sheet{height:92%;width:100%;border-radius:20px 20px 0 0;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.sheet-head{height:56px;flex:0 0 56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #EEE;font-size:16px;font-weight:700}
.sheet-head button{border:0;background:transparent;font-size:24px}
.sheet-body{overflow-y:auto;padding:18px 20px 28px;min-height:0}
.sheet-body h4{font-size:17px;margin:22px 0 8px;padding-top:10px;border-top:8px solid #F8F9FA}
.sheet-row{display:flex;justify-content:space-between;gap:15px;font-size:13px;padding:10px 0;border-bottom:1px solid #EEE}
.sheet-row em{font-style:normal;color:#757575}
.booking-month{display:flex;align-items:center;justify-content:space-between;margin-top:18px;margin-bottom:12px}
.booking-month button{width:28px;height:28px;background:none;border:0;font-size:24px}
.booking-days{display:flex;gap:12px}
.booking-day,.booking-slot{background:#F8F9FA;border:1px solid transparent;border-radius:8px;color:#757575;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center}
.booking-day{height:64px;width:60px;flex-direction:column;line-height:1.4}
.booking-day small{font-size:12px}
.booking-day.is-active,.booking-slot.is-active{background:#F1FBF5;border-color:#2AAD5C;color:#2AAD5C}
.booking-caption{font-size:14px;font-weight:700;margin:26px 0 12px}
.booking-slots{display:grid;grid-template-columns:repeat(4,70px);gap:8px 12px}
.booking-slot{height:40px}
.booking-minutes{display:grid;grid-template-columns:repeat(4,70px);gap:8px 12px}
.booking-finish{display:flex;flex-direction:column;align-items:center;padding-top:34px;text-align:center}
.booking-check{height:64px;width:64px;display:grid;place-items:center;background:#E8F5E9;color:#4CAF50;border-radius:50%;font-size:37px;margin-bottom:24px}
.booking-finish h2{font-size:24px;margin:0 0 8px;letter-spacing:-.6px}
.booking-finish p{font-size:15px;color:#757575;line-height:1.4;margin:0}
.booking-details{width:320px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:42px}
.booking-detail{min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F8F9FA;border-radius:12px}
.booking-detail small{color:#888;font-size:13px}
.booking-detail strong{font-size:16px;font-weight:700;color:#222;background:transparent}
.footer-actions{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 24px;display:flex;gap:8px;background:#fff}
.footer-actions button{min-height:56px;border-radius:8px;border:0;font-size:15px;font-weight:700}
.footer-actions button:first-child{flex:1;background:#F8F9FA;color:#222}
.footer-actions button:last-child{flex:1.3;background:#2AAD5C;color:#fff}
@media(max-width:650px){.stage{gap:8px;padding:5px;justify-content:center}.outside{width:92px;flex-basis:92px;gap:8px}.outside h1{font-size:15px;line-height:1.4;margin:0 0 8px}.outside button{font-size:12px;text-align:center;padding:8px 5px}.phone{zoom:min(1,calc((100vw - 115px)/360));}}
@media(max-height:740px) and (min-width:651px){.phone{zoom:calc((100dvh - 20px)/715)}}
@media(prefers-reduced-motion:reduce){.chat-message{animation:none}*{scroll-behavior:auto!important}}

/* Figma-specific corrections: survey opening and the two explicitly requested chat cards. */
.survey-opening{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.survey-opening svg{display:block;width:72px;height:72px;flex:0 0 72px}
.survey-opening .opening-desc{margin:0;color:#757575;font-size:16px;font-weight:400;line-height:1.4;letter-spacing:-.32px}
.survey-opening .title{margin-top:-8px}
.bot-bubble.ingredient-card{padding:16px;border-radius:2px 20px 20px 20px;box-shadow:0 1px 5px #0000000a,0 0 5px #0000000a,0 0 1px #0000000a}
.bot-bubble.consult-card{padding:15px 16px;border-radius:12px;box-shadow:0 1px 5px #0000000a,0 0 5px #0000000a,0 0 1px #0000000a}
.nutrient-panels{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.nutrient-panel{width:268px;overflow:hidden;background:#F8F9FA;border-radius:8px}
.nutrient-panel__head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.28px}
.nutrient-panel__head span{display:inline-flex;align-items:center;justify-content:center;min-height:20px;border-radius:4px;padding:2px 6px;font-size:12px;font-weight:500;letter-spacing:-.12px;background:#fff}
.nutrient-panel--caution .nutrient-panel__head{background:#FEE6E6;color:#F60909}
.nutrient-panel--caution .nutrient-panel__head span{background:#F8F9FA}
.nutrient-panel--recommend .nutrient-panel__head{background:#E8F5E9;color:#228A4A}
.nutrient-panel--recommend .nutrient-panel__head span{color:#2AAD5C}
.nutrient-panel__body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 0}
.nutrient-panel--caution .nutrient-panel__body{grid-auto-rows:52px}
.nutrient-panel--recommend .nutrient-panel__body{grid-auto-rows:62px;padding:6px 0}
.nutrient-panel__item{min-width:0;display:flex;align-items:center;gap:4px;padding:0 9px;font-size:16px;font-weight:500;line-height:1.4;letter-spacing:-.32px}
.nutrient-panel__item:nth-child(odd){border-right:1px solid #E2E3E5}
.nutrient-panel__item:nth-child(n+3){border-top:1px solid #E2E3E5}
.nutrient-panel__item img{width:37px;height:34px;object-fit:contain;flex:0 0 37px}
.nutrient-panel__item span{min-width:0;overflow-wrap:break-word}
.consult-panel{width:268px;height:330px;margin-top:16px;padding:16px 12px;background:#F1FBF5;border-radius:8px}
.consult-panel__head{width:140px;height:34px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border:1px solid #AADEBE;border-radius:53px;background:#F1FBF5;color:#228A4A;font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.28px;white-space:nowrap}
.consult-panel__grid{display:grid;grid-template-columns:repeat(2,118px);grid-template-rows:repeat(2,122px);gap:8px}
.consult-panel__tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;background:#fff;border-radius:8px;text-align:center}
.consult-panel__tile img{width:20px;height:20px;object-fit:contain}
.consult-panel__tile span{margin-top:6px;font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.28px;white-space:nowrap}
.consult-panel__tile strong{color:#228A4A;font-size:24px;font-weight:700;line-height:1.4;margin-top:4px}
.consult-panel__tile strong small{font-size:14px;font-weight:500;line-height:1.3}
.booking-month{justify-content:flex-start}
.chat-body.with-footer{bottom:132px}

/* Only the external title wrapping and the health-report bottom sheet are overridden here. */
.outside h1{white-space:nowrap;font-size:16px;letter-spacing:-.05em}
.sheet-overlay{inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;overflow:hidden}
.sheet-overlay .sheet{width:100%;height:100%;min-height:0;border-radius:0;background:#fff;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet-overlay.is-open .sheet{transform:translateY(0)}
.sheet-overlay .sheet-head{position:relative;height:56px;flex:0 0 56px;border-bottom:0;padding:0 56px;justify-content:center;font-size:16px;font-weight:700;line-height:1.4;letter-spacing:-.32px}
.sheet-overlay .sheet-head button{position:absolute;right:4px;top:4px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:400;color:#222}
.sheet-overlay .sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0;background:#fff}
.sheet-intro{height:228px;padding:24px 20px 0}
.sheet-intro-title{font-size:24px;font-weight:500;line-height:1.4;letter-spacing:-.6px;color:#222}
.sheet-statuses{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;align-items:center;height:94px}
.sheet-status{height:94px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.sheet-status+.sheet-status:before{content:"";position:absolute;left:0;top:20px;height:47px;width:1px;background:#DDD}
.sheet-status img{width:24px;height:24px;object-fit:contain}
.sheet-status.danger img{width:30px;height:24px}
.sheet-status strong{font-size:16px;font-weight:700;line-height:1.4;letter-spacing:-.32px}
.sheet-status.danger strong{color:#F60909}
.sheet-status.warning strong{color:#FF8F0C}
.sheet-status.normal strong{color:#228A4A}
.sheet-divider{height:8px;min-height:8px;background:#F8F9FA}
.sheet-section{padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.sheet-section h4{margin:0;padding:0;border:0;font-size:18px;font-weight:700;line-height:1.4;letter-spacing:-.36px;color:#222}
.sheet-section-rows{display:flex;flex-direction:column;gap:20px}
.sheet-data-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;font-size:16px;font-weight:400;line-height:1.4;letter-spacing:-.32px}
.sheet-data-row>span:first-child{color:#757575}
.sheet-data-value{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:#222;white-space:nowrap}
.sheet-data-value em{min-width:35px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px;border-radius:4px;font-style:normal;font-size:13px;font-weight:700;line-height:1.3;letter-spacing:-.13px}
.sheet-data-value em.ok{background:#F1FBF5;color:#228A4A}
.sheet-data-value em.warn{background:#FFE9CF;color:#FF7A00}
@media(max-width:650px){.outside h1{font-size:9px;letter-spacing:-.05em;white-space:nowrap}}
@media(prefers-reduced-motion:reduce){.sheet-overlay .sheet{transition-duration:.01ms}}

</style>
</head>
<body>
<div class="stage">
<aside class="outside"><h1>추천결과지 프로토타입</h1><button id="previous" type="button">← 이전 화면</button><button id="following" type="button">다음 화면 →</button><button id="entire" type="button">추천결과지 전체 보기</button></aside>
<main id="app" class="phone" aria-label="필그램 추천결과지 모바일 시연"></main>
</div>
<script>
"use strict";
var app=document.getElementById("app"),prev=document.getElementById("previous"),next=document.getElementById("following"),entire=document.getElementById("entire");
var img=function(name){return "./assets/"+name+".png"};

 var needsUserBubble=!state.chatConfirmed;
 if(needsUserBubble&&state.chatCount>=3)stream.insertAdjacentHTML("beforeend",'<div class="user-choice"><span>확인할래요</span></div>');
 for(var i=state.chatCount;i<=4;i++){stream.insertAdjacentHTML("beforeend",resultBlock(i));if(needsUserBubble&&i===2)stream.insertAdjacentHTML("beforeend",'<div class="user-choice"><span>확인할래요</span></div>');}
 state.chatCount=5;state.chatWaiting=false;state.chatConfirmed=true;state.chatReady=true;
 document.getElementById("chat-prompt").innerHTML="";
 var oldFooter=app.querySelector(".footer.chat-footer");if(oldFooter)oldFooter.remove();
 app.insertAdjacentHTML("beforeend",foot("상담 예약하기","book-start"));
 sc.classList.add("with-footer");sc.scrollTo({top:sc.scrollHeight-sc.clientHeight,behavior:"smooth"});
}
app.addEventListener("click",function(e){
 var b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
 var a=b.dataset.act,v=b.dataset.val;
 if(a==="prev"){goPrevious();return;}
 if(a==="next"){goNext();return;}
 if(a==="gender"||a==="age"||a==="digest"){state[a]=v;render();return;}
 if(a==="adverse"){if(v==="없음")state.adverse=["없음"];else{state.adverse=state.adverse.filter(function(x){return x!=="없음"});state.adverse=state.adverse.includes(v)?state.adverse.filter(function(x){return x!==v}):state.adverse.concat(v);}render();return;}
 if(a==="clear-name"){state.name="";var inp=document.getElementById("pack-input");if(inp){inp.value="";document.getElementById("name-shell").classList.remove("has-text");document.getElementById("pack-name").textContent=" 님";var button=app.querySelector(".footer .cta");if(button)button.disabled=true;inp.focus();}return;}
 if(a==="open-sheet"){state.sheet=true;stopChat();app.insertAdjacentHTML("beforeend",sheetHtml());requestAnimationFrame(function(){var overlay=app.querySelector(".sheet-overlay");if(overlay){var sheet=overlay.querySelector(".sheet");if(sheet)void sheet.offsetHeight;overlay.classList.add("is-open");}});return;}
 if(a==="close-sheet"){closeHealthSheet();return;}
 if(a==="confirm-results"){state.chatWaiting=false;state.chatConfirmed=true;var footer=app.querySelector(".footer.chat-footer");if(footer)footer.remove();var sc=document.getElementById("chat-body"),stream=document.getElementById("chat-stream");if(sc)sc.classList.remove("with-footer");if(stream){stream.insertAdjacentHTML("beforeend",'<div class="user-choice"><span>확인할래요</span></div>');if(sc)sc.scrollTo({top:sc.scrollHeight-sc.clientHeight,behavior:"smooth"});}stopChat();revealTimer=setTimeout(function(){appendChat(3)},450);return;}
 if(a==="book-start"){if(state.chatReady){state.page=7;render();}return;}
 if(a==="booking-day"){state.day=Number(v);render();return;}
 if(a==="booking-hour"){state.hour=v;render();return;}
 if(a==="booking-minute"){state.minute=v;render();return;}
 if(a==="reserve"){state.booked={day:days[state.day][0]+"일 ("+days[state.day][1]+")",time:state.hour+" "+state.minute};state.page=8;render();return;}
 if(a==="booking-change"){state.page=7;render();return;}
 if(a==="reset"){stopChat();state=initial();render();return;}
 if(a==="exit-result"){state.page=5;render();return;}
});
app.addEventListener("input",function(e){if(e.target.id==="pack-input"){state.name=e.target.value;var shell=document.getElementById("name-shell");if(shell)shell.classList.toggle("has-text",!!state.name);var name=document.getElementById("pack-name");if(name)name.textContent=(state.name||"")+" 님";var button=app.querySelector(".footer .cta");if(button)button.disabled=!state.name.trim();}});
prev.addEventListener("click",goPrevious);next.addEventListener("click",goNext);entire.addEventListener("click",showAllChat);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.sheet){closeHealthSheet();return;}if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")goPrevious();if(e.key==="ArrowRight")goNext();});
render();
</script>
