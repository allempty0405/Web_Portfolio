<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천결과지 프로토타입</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#222}body{background:#f5f6f7}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:28px;padding:12px}
.outside{width:180px;flex:0 0 180px;display:flex;flex-direction:column;gap:12px}
.outside h1{font-size:23px;line-height:1.4;letter-spacing:-.05em;margin:0 0 18px}
.outside button{min-height:46px;border:1px solid #d6ddd8;border-radius:8px;background:#fff;text-align:left;padding:10px 14px;font-size:14px;cursor:pointer;font-weight:650}
.outside button:disabled{opacity:.4;cursor:not-allowed}
.phone{width:360px;height:715px;flex:0 0 360px;position:relative;overflow:hidden;border-radius:32px;background:#f8f9fa;box-shadow:0 12px 42px #203a2520}
.shot{width:360px;height:715px;display:block;pointer-events:none;user-select:none}
.hit{position:absolute;z-index:4;border:0;background:transparent;font-size:0;color:transparent;cursor:pointer;padding:0}
.hit:focus-visible,.outside button:focus-visible,.name-input:focus-visible{outline:3px solid #2aad5c;outline-offset:2px}
.paint{position:absolute;z-index:3}
.tile{position:absolute;z-index:3;width:156px;height:98px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}
.tile img{width:40px;height:40px;object-fit:contain}.selected{background:#f1fbf5!important;border:1px solid #2aad5c!important;color:#222!important}.plain{background:#f8f9fa!important;border:1px solid transparent!important;color:#757575!important}
.chip{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:16px;font-weight:500;white-space:nowrap}
.name-input{position:absolute;z-index:5;top:208px;left:36px;width:285px;height:24px;border:0;outline:0;background:white;color:#222;font-size:16px;font-family:inherit;letter-spacing:-.03em}
.name-preview{position:absolute;z-index:4;top:328px;left:106px;min-width:90px;max-width:120px;height:21px;background:white;white-space:nowrap;overflow:hidden;font-size:14px}
.booking-chip{position:absolute;z-index:3;display:flex;justify-content:center;align-items:center;background:#f8f9fa;color:#757575;border-radius:8px;font-size:14px;font-weight:500}
.booking-chip.day{flex-direction:column}.booking-chip small{font-size:12px}
.booking-cta{position:absolute;z-index:3;top:619px;left:20px;width:320px;height:56px;display:flex;align-items:center;justify-content:center;background:#2aad5c;border-radius:8px;color:white;font-size:16px;font-weight:700}
.booking-summary{position:absolute;z-index:3;top:321px;left:58px;width:246px;height:34px;background:white;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.scroll{position:absolute;top:56px;bottom:132px;width:360px;overflow-y:auto;background:#f8f9fa}
.scroll img{width:360px;height:2156px;display:block;margin-top:-56px;user-select:none;pointer-events:none}
.crop{position:absolute;left:0;width:360px;overflow:hidden;z-index:2;pointer-events:none}
.crop img{width:360px;height:715px;position:absolute;left:0}
.detail-scroll{position:absolute;top:0;left:0;width:360px;height:715px;overflow-y:auto;z-index:2;background:white}
.detail-scroll img{width:360px;height:1692px;display:block}
.close{position:absolute;z-index:5;top:9px;left:8px;width:42px;height:42px;cursor:pointer;border:0;background:transparent;color:transparent}
@media(max-width:620px){.stage{gap:8px;padding:5px}.outside{width:92px;flex-basis:92px;gap:8px}.outside h1{font-size:15px;margin-bottom:10px}.outside button{text-align:center;padding:6px 4px;font-size:12px}.phone{zoom:min(1,calc((100vw - 112px)/360))}}
@media(max-height:740px) and (min-width:621px){.phone{zoom:calc((100dvh - 24px)/715)}}
</style></head><body>
<div class="stage"><aside class="outside"><h1>추천결과지 프로토타입</h1><button id="prev" data-act="prev">← 이전 화면</button><button id="next" data-act="next">다음 화면 →</button><button id="whole" data-act="whole">추천결과지 전체 보기</button></aside><main id="phone" class="phone" aria-label="필그램 인터랙티브 프로토타입"></main></div>
<script>
"use strict";
const el=id=>document.getElementById(id),asset=n=>"./assets/"+n+".png";
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function initial(){return {p:0,gender:"남성",age:"19세 이하",digest:"예",multi:["없음"],edited:false,name:"필그램",r:0,whole:false,detail:"",day:0,hour:"12",minute:"30",booking:null}}
let s=initial(),timer;
const pictures=["survey-start","gender","age","digest","multi","pack","","booking","booked"];
const ages=[["19세 이하",20,156,113],["20대",141,156,64],["30대",213,156,68],["40대",20,212,66],["50대",94,212,65],["60세 이상",167,212,99]];
const mult=[["없음",20,220,64],["홍삼",88,220,64],["종합비타민",156,220,120],["오메가3",20,276,67],["유산균",91,276,76],["비타민C",171,276,105],["비타민C ",20,332,68],["비타민B",92,332,87],["철분",183,332,68],["밀크씨슬",20,388,79],["마그네슘",103,388,83],["칼슘",190,388,72],["아연",266,388,74],["루테인",20,444,75],["비타민D",99,444,82],["비타민A",185,444,88],["엽산",20,500,60],["코엔자임Q10",84,500,113],["크롬",201,500,74]];
const days=[["25","오늘"],["26","내일"],["27","금"]],hours=["9","10","11","12","14","15","16","17"],mins=["00","10","20","30","40","50"];
function hot(x,y,w,h,act,label,v=""){return '<button type="button" class="hit" data-act="'+act+'" data-val="'+escapeHTML(v)+'" aria-label="'+escapeHTML(label)+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px"></button>'}
function screen(n){return '<img class="shot" alt="" src="'+asset(n)+'" draggable="false">'}
function tile(x,y,text,icon,selected){return '<span class="tile '+(selected?"selected":"plain")+'" style="left:'+x+'px;top:'+y+'px"><img alt="" src="'+asset(icon)+'"><span>'+text+'</span></span>'}
function chip(text,x,y,w,h,selected,extra=""){return '<span class="chip '+(selected?"selected":"plain")+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;'+extra+'">'+text+'</span>'}
function bookingchip(text,x,y,w,h,on,cls=""){return '<span class="booking-chip '+cls+' '+(on?"selected":"plain")+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px">'+text+'</span>'}
function render(){
 clearTimeout(timer);let bg="",over="",act="";let p=s.p;
 el("prev").disabled=p===0&&!s.detail;el("next").disabled=p===8&&!s.detail;
 el("whole").style.display=p===6?"block":"none";el("whole").textContent=s.whole?"채팅형 순차 보기":"추천결과지 전체 보기";
 if(s.detail==="modal"){bg=screen("detail-modal");act=hot(0,115,360,598,"detail-full","건강검진 전체 상세 스크롤")+hot(305,66,50,47,"close","닫기");}
 else if(s.detail==="full"){bg='<div class="detail-scroll"><img src="'+asset("detail-full")+'" alt="건강검진 전체 상세"></div>';act=hot(0,0,54,56,"close","건강검진 결과로 돌아가기");}
 else if(p===6&&s.whole){
  bg='<div class="scroll" id="full-scroll"><img src="'+asset("result-full")+'" alt="건강 상태부터 추천·주의 영양성분, 상담까지의 전체 추천결과지">'+hot(36,204,268,32,"detail","건강검진 결과 자세히 보기")+'</div><div class="crop" style="top:0;height:56px"><img src="'+asset("result-06")+'" style="top:0"></div><div class="crop" style="bottom:0;height:132px"><img src="'+asset("result-06")+'" style="top:-583px"></div>';
  act=hot(20,619,320,56,"reserve","상담 예약하기")+hot(4,4,48,48,"prev","이전 화면");
  if(s.name!=="필그램")over='<span class="paint" style="left:36px;top:140px;width:268px;height:22px;background:white;font-size:14px">'+escapeHTML(s.name)+'님의 건강검진 결과예요.</span>';
 }else{
  bg=screen(p===6?"result-0"+(s.r+1):pictures[p]);
  if(p===0){act+=hot(20,619,320,56,"next","설문 시작하기");}
  if(p===1){
   act+=hot(20,154,156,98,"gender","남성 선택","남성")+hot(184,154,156,98,"gender","여성 선택","여성")+hot(20,619,320,56,"next","다음");
   if(s.gender!=="남성")over+=tile(20,154,"남성","icon-man",false)+tile(184,154,"여성","icon-woman",true);
  }
  if(p===2){
   ages.forEach(z=>{let [text,x,y,w]=z;act+=hot(x,y,w,40,"age",text+" 선택",text);if(s.age!=="19세 이하")over+=chip(text,x,y,w,40,s.age===text)});
   act+=hot(20,619,320,56,"next","다음");
  }
  if(p===3){
   act+=hot(20,184,156,98,"digest","예 선택","예")+hot(184,184,156,98,"digest","아니오 선택","아니오")+hot(20,619,320,56,"next","다음");
   if(s.digest!=="예")over+=tile(20,184,"예","icon-yes",false)+tile(184,184,"아니오","icon-no",true);
  }
  if(p===4){
   mult.forEach(z=>{let [text,x,y,w]=z;act+=hot(x,y,w,40,"multi",text+" 선택",text);if(s.edited)over+=chip(text,x,y,w,40,s.multi.includes(text));});
   act+=hot(20,570,320,48,"multi","기타 영양제","기타 영양제")+hot(20,619,320,56,"next","다음");
   if(s.edited&&s.multi.includes("기타 영양제"))over+=chip("기타 영양제",20,570,320,48,true,"justify-content:flex-start;padding-left:16px");
  }
  if(p===5){act+=hot(20,619,320,56,"next","추천 결과로 이동");over+='<input id="pack-input" class="name-input" maxlength="12" aria-label="팩 이름 입력" value="'+escapeHTML(s.name)+'"><span id="name-preview" class="name-preview">'+escapeHTML(s.name)+'님</span>';}
  if(p===6){
   act+=hot(4,4,48,48,"prev","이전 화면");
   if(s.r===0)act+=hot(36,260,268,32,"detail","건강검진 결과 자세히 보기");
   if(s.r===2)act+=hot(20,621,320,56,"result-next","확인할래요");
   if(s.r===3)act+=hot(220,524,120,56,"result-next","확인할래요");
   if(s.r===5)act+=hot(20,619,320,56,"reserve","상담 예약하기");
   if(s.name!=="필그램"&&s.r===0)over+='<span class="paint" style="left:36px;top:140px;width:268px;height:24px;background:white;font-size:14px">'+escapeHTML(s.name)+'님의 건강검진 결과예요.</span>';
  }
  if(p===7){
   act+=hot(4,4,48,48,"prev","이전 화면");
   days.forEach((z,i)=>{let x=20+i*72;act+=hot(x,209,60,64,"day",z[0]+"일 선택",String(i));if(s.day!==0)over+=bookingchip(z[0]+"<small>"+z[1]+"</small>",x,209,60,64,s.day===i,"day")});
   hours.forEach((t,i)=>{let x=21+i%4*83,y=346+Math.floor(i/4)*52;act+=hot(x,y,70,40,"hour",t+"시 선택",t);if(s.hour!=="12")over+=bookingchip(t+"시",x,y,70,40,s.hour===t)});
   mins.forEach((t,i)=>{let x=i<4?21+i*83:20+(i-4)*83,y=i<4?511:563;act+=hot(x,y,70,40,"minute",t+"분 선택",t);if(s.minute!=="30")over+=bookingchip(t+"분",x,y,70,40,s.minute===t)});
   if(s.day!==0||s.hour!=="12"||s.minute!=="30")over+='<div class="booking-cta">'+(s.day===0?"오늘":days[s.day][0]+"일")+' '+s.hour+'시 '+s.minute+'분으로 예약하기</div>';
   act+=hot(20,619,320,56,"book","상담 예약 확정");
  }
  if(p===8){
   act+=hot(4,4,48,48,"prev","이전 화면")+hot(20,619,120,56,"change","예약 변경하기")+hot(148,619,192,56,"reset","처음으로 가기");
   if(s.booking)over+='<div class="booking-summary"><span>'+escapeHTML(s.booking.date)+'</span><span>'+escapeHTML(s.booking.time)+'</span></div>';
  }
  if(p>0&&p<6)act+=hot(4,4,48,48,"prev","이전 화면");
 }
 el("phone").innerHTML=bg+over+act;
 const inp=el("pack-input");if(inp)inp.addEventListener("input",e=>{s.name=e.target.value;el("name-preview").textContent=s.name+"님"});
 if(p===6&&!s.whole&&!s.detail&&[0,1,3,4].includes(s.r)){const at=s.r;timer=setTimeout(()=>{if(s.p===6&&!s.whole&&!s.detail&&s.r===at){s.r++;render()}},at===0?1700:at===1?1900:at===3?850:1700);}
}
function next(external=false){
 if(s.detail){if(s.detail==="modal")s.detail="full";else s.detail="";render();return}
 if(s.p===6){if(s.whole){s.p=7;s.whole=false}else if(s.r<5)s.r++;else s.p=7;render();return}
 if(s.p===5&&!s.name.trim()&&!external){el("pack-input").focus();return}
 s.p=Math.min(8,s.p+1);render()
}
function prev(){
 if(s.detail){s.detail="";render();return}
 if(s.p===6){if(s.whole){s.whole=false;s.r=5}else if(s.r>0)s.r--;else s.p=5}
 else if(s.p>0){s.p--;if(s.p===6)s.r=5}
 render()
}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.val;
 if(a==="next"){next(b.id==="next");return}if(a==="prev"){prev();return}
 if(a==="whole"){s.whole=!s.whole;s.r=5;render();return}
 if(["gender","age","digest"].includes(a)){s[a]=v;render();return}
 if(a==="multi"){s.edited=true;if(v==="없음")s.multi=["없음"];else{s.multi=s.multi.filter(x=>x!=="없음");s.multi=s.multi.includes(v)?s.multi.filter(x=>x!==v):s.multi.concat(v)}render();return}
 if(a==="result-next"){s.r=Math.min(5,s.r+1);render();return}
 if(a==="detail"){s.detail="modal";render();return}if(a==="detail-full"){s.detail="full";render();return}
 if(a==="close"){s.detail="";render();return}
 if(a==="reserve"){s.p=7;s.whole=false;render();return}
 if(a==="day"){s.day=Number(v);render();return}if(a==="hour"){s.hour=v;render();return}if(a==="minute"){s.minute=v;render();return}
 if(a==="book"){s.booking={date:days[s.day][0]+"일 ("+days[s.day][1]+")",time:s.hour+"시 "+s.minute+"분"};s.p=8;render();return}
 if(a==="change"){s.p=7;render();return}if(a==="reset"){s=initial();render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&s.detail){s.detail="";render();return}if(e.target.tagName==="INPUT")return;if(e.key==="ArrowLeft")prev();if(e.key==="ArrowRight")next(true)});
render();
</script></body></html>
